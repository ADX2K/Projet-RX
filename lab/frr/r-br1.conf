! r-br1 : routeur de l'agence 1
!   eth1 -> r-core1  10.9.250.5/31  100 Mb/s (tc)
!   eth2 -> h-br1    LAN 10.9.3.0/24 · fd00:9:3::/64   (point de mesure flux)
!
frr defaults traditional
hostname r-br1
service integrated-vtysh-config
!
interface lo
 ip address 10.9.255.5/32
 ipv6 address fd00:9:ff::5/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 ip address 10.9.250.5/31
 ipv6 address fd00:9:fa::5/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
! LAN : annoncé dans OSPF, mais aucun voisin OSPF de ce côté (passive).
interface eth2
 ip address 10.9.3.1/24
 ipv6 address fd00:9:3::1/64
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
router ospf
 ospf router-id 10.9.255.5
!
router ospf6
 ospf6 router-id 10.9.255.5
!
