! r-core1 : routeur de cœur
!   eth1 -> r-core2  10.9.250.0/31  1 Gb/s
!   eth2 -> r-hq     10.9.250.2/31  1 Gb/s
!   eth3 -> r-br1    10.9.250.4/31  100 Mb/s (tc)
!
frr defaults traditional
hostname r-core1
service integrated-vtysh-config
!
interface lo
 ip address 10.9.255.1/32
 ipv6 address fd00:9:ff::1/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 ip address 10.9.250.0/31
 ipv6 address fd00:9:fa::/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
interface eth2
 ip address 10.9.250.2/31
 ipv6 address fd00:9:fa::2/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
interface eth3
 ip address 10.9.250.4/31
 ipv6 address fd00:9:fa::4/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
router ospf
 ospf router-id 10.9.255.1
!
router ospf6
 ospf6 router-id 10.9.255.1
!
