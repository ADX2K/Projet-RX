! r-core2 : routeur de cœur
!   eth1 -> r-core1  10.9.250.1/31  1 Gb/s
!   eth2 -> r-dc     10.9.250.6/31  1 Gb/s
!   eth3 -> r-br2    10.9.250.8/31  100 Mb/s (tc)
!
frr defaults traditional
hostname r-core2
service integrated-vtysh-config
!
interface lo
 ip address 10.9.255.2/32
 ipv6 address fd00:9:ff::2/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 ip address 10.9.250.1/31
 ipv6 address fd00:9:fa::1/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
interface eth2
 ip address 10.9.250.6/31
 ipv6 address fd00:9:fa::6/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
interface eth3
 ip address 10.9.250.8/31
 ipv6 address fd00:9:fa::8/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
router ospf
 ospf router-id 10.9.255.2
!
router ospf6
 ospf6 router-id 10.9.255.2
!
