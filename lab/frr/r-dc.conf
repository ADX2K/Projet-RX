! r-dc : routeur d'accès du datacenter
!   eth1 -> r-core2  10.9.250.7/31  1 Gb/s
!   eth2 -> sw-dc    LAN 10.9.2.0/24 · fd00:9:2::/64   (point de mesure flux)
!
frr defaults traditional
hostname r-dc
service integrated-vtysh-config
!
interface lo
 ip address 10.9.255.4/32
 ipv6 address fd00:9:ff::4/128
 ip ospf area 0
 ipv6 ospf6 area 0
!
interface eth1
 ip address 10.9.250.7/31
 ipv6 address fd00:9:fa::7/127
 ip ospf network point-to-point
 ip ospf area 0
 ipv6 ospf6 network point-to-point
 ipv6 ospf6 area 0
!
! LAN : annoncé dans OSPF, mais aucun voisin OSPF de ce côté (passive).
interface eth2
 ip address 10.9.2.1/24
 ipv6 address fd00:9:2::1/64
 ip ospf area 0
 ip ospf passive
 ipv6 ospf6 area 0
 ipv6 ospf6 passive
!
router ospf
 ospf router-id 10.9.255.4
!
router ospf6
 ospf6 router-id 10.9.255.4
!
