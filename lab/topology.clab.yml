# Lab rt3p9 : réseau d'entreprise simulé du projet 9 (jalon J2).
# Schéma et plan d'adressage : docs/adressage.md
#
# Lancer :  make up      Vérifier : make check      Arrêter : make down
name: rt3p9

# Réseau de gestion (hors-bande) : chaque nœud y a son eth0.
# Toute la télémétrie (SNMP, sFlow, IPFIX, métriques) passe par ce réseau.
mgmt:
  network: rt3p9-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  # Valeurs communes à tous les nœuds (une valeur du nœud l'emporte).
  kinds:
    linux:
      privileged: true                 # sysctl, tc et captures pcap dans les conteneurs
      env:
        ENABLE_FLOW: "false"
        FLOW_COLLECTOR: 172.20.30.50
        SFLOW_N: "512"

  nodes:
    # --- Routeurs de cœur ---------------------------------------------------
    r-core1:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.11
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-core1.conf:/etc/frr/frr.conf:ro
      env:
        SHAPE: eth3=100mbit            # lien vers r-br1
        FLOW_IFACES: eth1              # lien de cœur

    r-core2:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.12
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-core2.conf:/etc/frr/frr.conf:ro
      env:
        SHAPE: eth3=100mbit            # lien vers r-br2

    # --- Routeurs d'accès ---------------------------------------------------
    r-hq:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.13
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-hq.conf:/etc/frr/frr.conf:ro
      env:
        FLOW_IFACES: eth2

    r-dc:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.14
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-dc.conf:/etc/frr/frr.conf:ro
      env:
        FLOW_IFACES: eth2

    r-br1:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.15
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-br1.conf:/etc/frr/frr.conf:ro
      env:
        SHAPE: eth1=100mbit            # lien vers r-core1
        FLOW_IFACES: eth2
        ENABLE_FLOW: "true"            # spike J2 : seul routeur qui exporte (J5 : tous)

    r-br2:
      kind: linux
      image: rt3/router:1.0
      mgmt-ipv4: 172.20.30.16
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - frr/r-br2.conf:/etc/frr/frr.conf:ro
      env:
        SHAPE: eth1=100mbit            # lien vers r-core2
        FLOW_IFACES: eth2

    # --- Commutateurs L2 (pont Linux) ---------------------------------------
    sw-hq:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.121
      env: { ROLE: switch }

    sw-dc:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.122
      env: { ROLE: switch }

    # --- Hôtes --------------------------------------------------------------
    h-user1:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.101
      env: { ADDR4: 10.9.1.10/24, GW4: 10.9.1.1, ADDR6: "fd00:9:1::10/64", GW6: "fd00:9:1::1" }

    h-user2:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.102
      env: { ADDR4: 10.9.1.11/24, GW4: 10.9.1.1, ADDR6: "fd00:9:1::11/64", GW6: "fd00:9:1::1" }

    h-web:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.103
      env: { ADDR4: 10.9.2.10/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::10/64", GW6: "fd00:9:2::1", SERVICES: web }

    h-dns:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.104
      env: { ADDR4: 10.9.2.11/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::11/64", GW6: "fd00:9:2::1", SERVICES: dns }

    h-iperf:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.105
      env: { ADDR4: 10.9.2.12/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::12/64", GW6: "fd00:9:2::1", SERVICES: iperf }

    h-br1:
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.106
      env: { ADDR4: 10.9.3.10/24, GW4: 10.9.3.1, ADDR6: "fd00:9:3::10/64", GW6: "fd00:9:3::1" }

    h-atk:                             # générateur d'incidents (labo isolé)
      kind: linux
      image: rt3/host:1.0
      mgmt-ipv4: 172.20.30.107
      env: { ADDR4: 10.9.4.10/24, GW4: 10.9.4.1, ADDR6: "fd00:9:4::10/64", GW6: "fd00:9:4::1" }

    # --- Supervision --------------------------------------------------------
    # goflow2 reçoit sFlow (6343) et IPFIX (4739) et écrit un flux JSON par ligne
    # sur sa sortie standard :  docker logs -f clab-rt3p9-goflow2
    goflow2:
      kind: linux
      image: netsampler/goflow2:v2.2.7
      mgmt-ipv4: 172.20.30.50
      cmd: -listen=sflow://:6343,netflow://:4739 -format=json

  links:
    # cœur
    - endpoints: ["r-core1:eth1", "r-core2:eth1"]
    - endpoints: ["r-core1:eth2", "r-hq:eth1"]
    - endpoints: ["r-core1:eth3", "r-br1:eth1"]
    - endpoints: ["r-core2:eth2", "r-dc:eth1"]
    - endpoints: ["r-core2:eth3", "r-br2:eth1"]
    # siège
    - endpoints: ["r-hq:eth2", "sw-hq:eth1"]
    - endpoints: ["sw-hq:eth2", "h-user1:eth1"]
    - endpoints: ["sw-hq:eth3", "h-user2:eth1"]
    # datacenter
    - endpoints: ["r-dc:eth2", "sw-dc:eth1"]
    - endpoints: ["sw-dc:eth2", "h-web:eth1"]
    - endpoints: ["sw-dc:eth3", "h-dns:eth1"]
    - endpoints: ["sw-dc:eth4", "h-iperf:eth1"]
    # agences
    - endpoints: ["r-br1:eth2", "h-br1:eth1"]
    - endpoints: ["r-br2:eth2", "h-atk:eth1"]
