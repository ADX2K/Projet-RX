# Lab rt3p9 : réseau d'entreprise simulé du projet 9.
# Schéma et plan d'adressage : docs/adressage.md
#
# Lancer :  make up      Vérifier : make check      Arrêter : make down
name: rt3p9

# Réseau de gestion (hors-bande) : chaque nœud y a son eth0.
# Toute la télémétrie (SNMP, sFlow, IPFIX, métriques) passe par ce réseau.
mgmt:
  network: rt3p9-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  # Réglages communs par famille de nœuds. Un nœud hérite de son groupe ;
  # ce qu'il déclare lui-même s'ajoute (binds, env) ou l'emporte.
  groups:
    routers:
      kind: linux
      image: rt3/router:1.0
      privileged: true                 # sysctl, tc et captures pcap
      binds:
        - frr/daemons:/etc/frr/daemons:ro
        - snmp/snmpd.conf:/etc/snmp/snmpd.conf:ro
      env:
        ENABLE_SNMP: "true"            # N1 : agent SNMP
        ENABLE_NODE_EXPORTER: "true"   # N2 : compteurs d'interfaces à 1 s
        ENABLE_FLOW: "true"            # N2 : export sFlow + IPFIX (interfaces de FLOW_IFACES)
        FLOW_COLLECTOR: 172.20.30.50   # flowcol
        SFLOW_N: "512"

    hosts:
      kind: linux
      image: rt3/host:1.0
      privileged: true

    monitoring:
      kind: linux

  nodes:
    # --- Routeurs de cœur ---------------------------------------------------
    r-core1:
      group: routers
      mgmt-ipv4: 172.20.30.11
      binds: [frr/r-core1.conf:/etc/frr/frr.conf:ro]
      env:
        SHAPE: eth3=100mbit            # lien vers r-br1
        FLOW_IFACES: eth1              # lien de cœur

    r-core2:
      group: routers
      mgmt-ipv4: 172.20.30.12
      binds: [frr/r-core2.conf:/etc/frr/frr.conf:ro]
      env:
        SHAPE: eth3=100mbit            # lien vers r-br2
                                       # pas de FLOW_IFACES : aucun point de mesure (D6)

    # --- Routeurs d'accès ---------------------------------------------------
    r-hq:
      group: routers
      mgmt-ipv4: 172.20.30.13
      binds: [frr/r-hq.conf:/etc/frr/frr.conf:ro]
      env:
        FLOW_IFACES: eth2

    r-dc:
      group: routers
      mgmt-ipv4: 172.20.30.14
      binds: [frr/r-dc.conf:/etc/frr/frr.conf:ro]
      env:
        FLOW_IFACES: eth2

    r-br1:
      group: routers
      mgmt-ipv4: 172.20.30.15
      binds: [frr/r-br1.conf:/etc/frr/frr.conf:ro]
      env:
        SHAPE: eth1=100mbit            # lien vers r-core1
        FLOW_IFACES: eth2

    r-br2:
      group: routers
      mgmt-ipv4: 172.20.30.16
      binds: [frr/r-br2.conf:/etc/frr/frr.conf:ro]
      env:
        SHAPE: eth1=100mbit            # lien vers r-core2
        FLOW_IFACES: eth2

    # --- Commutateurs L2 (pont Linux) ---------------------------------------
    sw-hq:   { group: hosts, mgmt-ipv4: 172.20.30.121, env: { ROLE: switch } }
    sw-dc:   { group: hosts, mgmt-ipv4: 172.20.30.122, env: { ROLE: switch } }

    # --- Hôtes --------------------------------------------------------------
    h-user1:
      group: hosts
      mgmt-ipv4: 172.20.30.101
      env: { ADDR4: 10.9.1.10/24, GW4: 10.9.1.1, ADDR6: "fd00:9:1::10/64", GW6: "fd00:9:1::1" }

    h-user2:
      group: hosts
      mgmt-ipv4: 172.20.30.102
      env: { ADDR4: 10.9.1.11/24, GW4: 10.9.1.1, ADDR6: "fd00:9:1::11/64", GW6: "fd00:9:1::1" }

    h-web:
      group: hosts
      mgmt-ipv4: 172.20.30.103
      env: { ADDR4: 10.9.2.10/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::10/64", GW6: "fd00:9:2::1", SERVICES: web }

    h-dns:
      group: hosts
      mgmt-ipv4: 172.20.30.104
      env: { ADDR4: 10.9.2.11/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::11/64", GW6: "fd00:9:2::1", SERVICES: dns }

    h-iperf:
      group: hosts
      mgmt-ipv4: 172.20.30.105
      env: { ADDR4: 10.9.2.12/24, GW4: 10.9.2.1, ADDR6: "fd00:9:2::12/64", GW6: "fd00:9:2::1", SERVICES: iperf }

    h-br1:
      group: hosts
      mgmt-ipv4: 172.20.30.106
      env: { ADDR4: 10.9.3.10/24, GW4: 10.9.3.1, ADDR6: "fd00:9:3::10/64", GW6: "fd00:9:3::1" }

    h-atk:                             # générateur d'incidents (labo isolé)
      group: hosts
      mgmt-ipv4: 172.20.30.107
      env: { ADDR4: 10.9.4.10/24, GW4: 10.9.4.1, ADDR6: "fd00:9:4::10/64", GW6: "fd00:9:4::1" }

    # --- Supervision --------------------------------------------------------
    # Accès depuis Windows : Grafana http://localhost:3000, prom-snmp (N1)
    # http://localhost:9091, prom-flow (N2) http://localhost:9090,
    # Alertmanager http://localhost:9093
    #
    # Les services qui gardent un état ont un volume Docker nommé (rt3p9-…) :
    # leurs données survivent à make down / make up. make reset-data les efface.

    # N1 · Prometheus interroge les routeurs en SNMP toutes les 5 min via snmp_exporter.
    snmp-exporter:
      group: monitoring
      image: prom/snmp-exporter:v0.30.1
      mgmt-ipv4: 172.20.30.56

    prom-snmp:
      group: monitoring
      image: prom/prometheus:v3.15.0
      mgmt-ipv4: 172.20.30.52
      binds: [../monitoring/prom-snmp:/etc/prometheus:ro]
      volumes: [rt3p9-prom-snmp:/prometheus]
      cmd: >-
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d
        --query.lookback-delta=10m
      ports: ["9091:9090"]

    # N2 · flowcol reçoit sFlow (6343) et IPFIX (4739) des routeurs : goflow2 les
    # décode, flow2prom en fait des métriques (:9199). prom-flow relève toutes les
    # secondes ces métriques et les compteurs d'interfaces des routeurs (node_exporter).
    flowcol:
      group: monitoring
      image: rt3/flowcol:1.0
      mgmt-ipv4: 172.20.30.50
      binds: [../src/flow2prom/flow2prom.py:/app/flow2prom.py:ro]
      env:
        ROUTERS: >-
          172.20.30.11=r-core1 172.20.30.12=r-core2 172.20.30.13=r-hq
          172.20.30.14=r-dc 172.20.30.15=r-br1 172.20.30.16=r-br2

    prom-flow:
      group: monitoring
      image: prom/prometheus:v3.15.0
      mgmt-ipv4: 172.20.30.53
      binds: [../monitoring/prom-flow:/etc/prometheus:ro]
      volumes: [rt3p9-prom-flow:/prometheus]
      # Un point par seconde : 7 jours ou 2 Go au plus, pour ne pas remplir le disque.
      cmd: >-
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
        --storage.tsdb.retention.size=2GB
      ports: ["9090:9090"]

    # Commun · alertes des deux niveaux : Prometheus -> Alertmanager -> alertsink,
    # qui note l'heure d'arrivée (docker logs) et garde l'historique dans alertdb.
    alertmanager:
      group: monitoring
      image: prom/alertmanager:v0.34.1
      mgmt-ipv4: 172.20.30.54
      binds: [../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
      volumes: [rt3p9-alertmanager:/alertmanager]
      ports: ["9093:9093"]

    alertsink:
      group: monitoring
      image: rt3/alertsink:1.0
      mgmt-ipv4: 172.20.30.57
      binds: [../src/alertsink/alertsink.py:/app/alertsink.py:ro]
      env:
        DATABASE_URL: postgresql://rt3:rt3@clab-rt3p9-alertdb:5432/alerts

    # Historique des alertes (PostgreSQL). Identifiants de labo, réseau de gestion seulement.
    alertdb:
      group: monitoring
      image: postgres:17.11-alpine
      mgmt-ipv4: 172.20.30.58
      binds: [../monitoring/alertdb/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro]
      volumes: [rt3p9-alertdb:/var/lib/postgresql/data]
      env:
        POSTGRES_DB: alerts
        POSTGRES_USER: rt3
        POSTGRES_PASSWORD: rt3

    # Commun · tableaux de bord N1 et N2, sans compte (accès anonyme en administrateur : labo local).
    grafana:
      group: monitoring
      image: grafana/grafana:13.2.4
      mgmt-ipv4: 172.20.30.55
      binds:
        - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
        - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      volumes: [rt3p9-grafana:/var/lib/grafana]
      env:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
      ports: ["3000:3000"]

  links:
    # cœur
    - endpoints: ["r-core1:eth1", "r-core2:eth1"]
    - endpoints: ["r-core1:eth2", "r-hq:eth1"]
    - endpoints: ["r-core1:eth3", "r-br1:eth1"]
    - endpoints: ["r-core2:eth2", "r-dc:eth1"]
    - endpoints: ["r-core2:eth3", "r-br2:eth1"]
    # siège
    - endpoints: ["r-hq:eth2", "sw-hq:eth1"]
    - endpoints: ["sw-hq:eth2", "h-user1:eth1"]
    - endpoints: ["sw-hq:eth3", "h-user2:eth1"]
    # datacenter
    - endpoints: ["r-dc:eth2", "sw-dc:eth1"]
    - endpoints: ["sw-dc:eth2", "h-web:eth1"]
    - endpoints: ["sw-dc:eth3", "h-dns:eth1"]
    - endpoints: ["sw-dc:eth4", "h-iperf:eth1"]
    # agences
    - endpoints: ["r-br1:eth2", "h-br1:eth1"]
    - endpoints: ["r-br2:eth2", "h-atk:eth1"]
